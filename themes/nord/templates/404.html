<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - {{ global.config.site_title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,300;0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,300;1,8..60,400;1,8..60,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/theme/style.css">
</head>
<body>
    <div class="site-container">
        <header class="site-header">
            <div class="header-inner">
                <h1><a href="/">{{ global.config.site_title }}</a></h1>
            </div>
        </header>

        <main>
            <div class="not-found">
                <h1>404</h1>
                <p>This page could not be found.</p>
                <a href="/">&larr; Back to Home</a>
            </div>
        </main>

        <footer class="site-footer">
            <div class="footer-inner">
                <span>&copy; {{ global.config.site_title }}</span>
            </div>
        </footer>
    </div>
</body>
</html>
