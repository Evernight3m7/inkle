<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - {{ global.config.site_title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600&family=JetBrains+Mono:ital,wght@0,400;0,500;1,400&family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/theme/style.css">
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <h1><a href="/">{{ global.config.site_title }}</a></h1>
        </div>
    </header>

    <main class="site-main">
        <div class="not-found">
            <div class="not-found-code">404</div>
            <h1>Page Not Found</h1>
            <p>The page you're looking for doesn't exist or has been moved.</p>
            <a href="/" class="btn-home">Go Home</a>
        </div>
    </main>

    <footer class="site-footer">
        <div class="footer-inner">
            <span class="footer-copy">&copy; {{ global.config.site_title }}</span>
        </div>
    </footer>
</body>
</html>
