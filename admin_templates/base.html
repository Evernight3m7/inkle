<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ site_title }} - Admin{% endblock %}</title>
    <link rel="stylesheet" href="/static/admin/admin.css">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <a href="/admin" class="topbar-logo">{{ site_title }}</a>
            <nav class="topbar-nav">
                <a href="/admin" class="topbar-link {% if current_path == 'dashboard' or (current_path == 'editor' and not is_new) %}active{% endif %}">Posts</a>
                <a href="/admin/posts/new" class="topbar-link {% if current_path == 'editor' and is_new %}active{% endif %}">New Post</a>
                <a href="/admin/settings" class="topbar-link {% if current_path == 'settings' %}active{% endif %}">Settings</a>
                <a href="/admin/themes" class="topbar-link {% if current_path == 'themes' %}active{% endif %}">Themes</a>
            </nav>
            <div class="topbar-actions">
                <a href="/" target="_blank" class="topbar-link">View Site</a>
                <button onclick="logout()" class="topbar-link topbar-logout">Logout</button>
            </div>
            <button class="topbar-menu-btn" onclick="toggleMobileMenu()" aria-label="Toggle menu" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <div id="mobile-menu" class="mobile-menu">
        <a href="/admin" class="mobile-link {% if current_path == 'dashboard' or (current_path == 'editor' and not is_new) %}active{% endif %}">Posts</a>
        <a href="/admin/posts/new" class="mobile-link {% if current_path == 'editor' and is_new %}active{% endif %}">New Post</a>
        <a href="/admin/settings" class="mobile-link {% if current_path == 'settings' %}active{% endif %}">Settings</a>
        <a href="/admin/themes" class="mobile-link {% if current_path == 'themes' %}active{% endif %}">Themes</a>
        <a href="/" target="_blank" class="mobile-link">View Site</a>
        <button onclick="logout()" class="mobile-link mobile-logout">Logout</button>
    </div>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <div id="toast-container" class="toast-container"></div>

    <div id="modal-overlay" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <p id="modal-message"></p>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button id="modal-confirm-btn" class="btn btn-danger">Confirm</button>
            </div>
        </div>
    </div>

    {% if ai_warning %}
    <script>document.addEventListener('DOMContentLoaded', function() { showAiConfigWarning(); });</script>
    {% endif %}
    <script src="/static/admin/admin.js"></script>
</body>
</html>
