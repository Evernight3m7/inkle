<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ site_title }} - Admin{% endblock %}</title>
    <link rel="stylesheet" href="/static/admin/admin.css">
</head>
<body>
    <div class="admin-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2><a href="/admin">{{ site_title }}</a></h2>
            </div>
            <nav class="sidebar-nav">
                <a href="/admin" class="nav-item {% if current_path == 'dashboard' or (current_path == 'editor' and not is_new) %}active{% endif %}">
                    <span class="nav-icon">&#x1F4CB;</span> Posts
                </a>
                <a href="/admin/posts/new" class="nav-item {% if current_path == 'editor' and is_new %}active{% endif %}">
                    <span class="nav-icon">&#x270F;&#xFE0F;</span> New Post
                </a>
                <a href="/admin/settings" class="nav-item {% if current_path == 'settings' %}active{% endif %}">
                    <span class="nav-icon">&#x2699;&#xFE0F;</span> Settings
                </a>
                <a href="/admin/themes" class="nav-item {% if current_path == 'themes' %}active{% endif %}">
                    <span class="nav-icon">&#x1F3A8;</span> Themes
                </a>
            </nav>
            <div class="sidebar-footer">
                <a href="/" target="_blank" class="nav-item">&#x1F310; View Site</a>
                <button onclick="logout()" class="nav-item logout-btn">&#x1F6AA; Logout</button>
            </div>
        </aside>
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <div id="modal-overlay" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <p id="modal-message"></p>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button id="modal-confirm-btn" class="btn btn-danger">Confirm</button>
            </div>
        </div>
    </div>

    {% if ai_warning %}
    <script>document.addEventListener('DOMContentLoaded', function() { showAiConfigWarning(); });</script>
    {% endif %}
    <script src="/static/admin/admin.js"></script>
</body>
</html>
