{% extends "base.html" %}
{% block title %}Settings - {{ site_title }}{% endblock %}
{% block content %}
<div class="page-header">
    <h1>Settings</h1>
</div>

<div class="settings-grid">
    <div class="card">
        <form id="settings-form" onsubmit="return false;">
            <div class="form-group">
                <label for="site-title">Site Title</label>
                <input type="text" id="site-title" class="input" value="{{ config.site_title }}">
            </div>
            <div class="form-group">
                <label for="site-subtitle">Site Subtitle</label>
                <input type="text" id="site-subtitle" class="input" value="{{ config.site_subtitle }}" placeholder="Optional">
            </div>
            <div class="form-group">
                <label for="posts-per-page">Posts Per Page</label>
                <input type="number" id="posts-per-page" class="input" min="1" max="100" value="{{ config.posts_per_page }}">
            </div>
            <div class="form-group">
                <label>Social Links</label>
                <div id="social-links-container">
                    {% for key, value in config.social_links %}
                    <div class="social-link-row">
                        <input type="text" class="input social-key" value="{{ key }}" placeholder="Platform (e.g., github)">
                        <input type="text" class="input social-value" value="{{ value }}" placeholder="URL">
                        <button type="button" class="btn btn-sm btn-danger" onclick="this.parentElement.remove()">&times;</button>
                    </div>
                    {% endfor %}
                </div>
                <button type="button" class="btn btn-sm btn-secondary" onclick="addSocialLink()" style="margin-top:8px;">+ Add Link</button>
            </div>
            <button type="button" class="btn btn-primary" onclick="saveSettings()">Save Settings</button>
        </form>
    </div>
</div>
{% endblock %}
